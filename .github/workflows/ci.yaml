name: Integrate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: gip
        shell: bash
        run: |
          npx -y pear-install pear://gipjk71nbuj3zasm4ywczb93zqk5xbfup16c6d5j8w8yeja4ob6o
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$LOCALAPPDATA\\Programs\\gip" >> "$GITHUB_PATH"
          else
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - uses: holepunchto/actions/node-base@v1
        with:
          allow-git: all
      - run: npm run lint

  build:
    name: ${{ matrix.host }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            host: linux-x64
          - os: ubuntu-24.04-arm
            host: linux-arm64
          - os: macos-latest
            host: darwin-arm64
          - os: macos-15-intel
            host: darwin-x64
          - os: windows-latest
            host: win32-x64
          - os: windows-11-arm
            host: win32-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Setup repo
        uses: holepunchto/actions/.github/steps/setup-repo@v1

      - name: gip
        shell: bash
        run: |
          npx -y pear-install pear://gipjk71nbuj3zasm4ywczb93zqk5xbfup16c6d5j8w8yeja4ob6o
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$LOCALAPPDATA\\Programs\\gip" >> "$GITHUB_PATH"
          else
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: pear
        shell: bash
        run: |
          npx -y pear-install pear://smw4thqaqed9iq6bae7a9cxd4fesruixgkafe38jny33ahs33igy
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$LOCALAPPDATA\\Programs\\pear" >> "$GITHUB_PATH"
          else
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Install w/ dev deps
        run: npm install

      - name: Build Local Runtime
        run: npm run make

      - name: Install Bare
        run: npm i -g bare-runtime

      - name: Test
        run: npm test
